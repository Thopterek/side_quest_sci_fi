# Parallax vault tuning.
#
# This is a single-operator dataset: a few thousand systems at most, read almost
# entirely at startup and written in small coalesced bursts. It is not a
# transactional workload, so the defaults are mostly too generous in the wrong
# places.

listen_addresses = '*'

# The whole vault fits in a few megabytes. Most of the win here is leaving RAM
# for the page cache rather than duplicating it in shared buffers.
shared_buffers = 64MB
effective_cache_size = 256MB

# Raised only because building the GIN index on systems.search is the single
# heaviest thing this database ever does.
maintenance_work_mem = 128MB

work_mem = 8MB

# Writes arrive in bursts of a handful of rows, several seconds apart. Grouping
# commits buys nothing and costs latency on the flush after typing stops.
synchronous_commit = on
wal_writer_delay = 200ms

# Assume the host is on SSD; the planner should not avoid the search index.
random_page_cost = 1.1

# Enough to see a migration or a constraint rejection without logging every
# coalesced dossier write.
log_min_duration_statement = 250ms
log_line_prefix = '%m [%p] %q%u@%d '
