[package]
name = "parallax"
version = "0.1.0"
edition = "2021"
description = "A vault for star systems: Obsidian's shape applied to the NASA Exoplanet Archive"
license = "MIT OR Apache-2.0"

[lib]
name = "parallax"
path = "src/lib.rs"

# The face: the egui client. Talks HTTP to the server, never to the database.
[[bin]]
name = "parallax"
path = "src/main.rs"
required-features = ["gui"]

# The backend: owns the connection pool and every write.
[[bin]]
name = "parallax-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = ["gui", "client"]
# The GUI is optional so `cargo test --no-default-features` can exercise the
# astronomy core without pulling in a windowing stack.
gui = ["dep:egui", "dep:eframe", "dep:ehttp", "dep:log"]
# PostgreSQL-backed vault. Native only; wasm falls back to MemoryStore.
db = ["dep:postgres"]
# HTTP client backend for the face, so it needs no database credentials.
client = ["dep:ureq"]
# Capability links. Needed by anything that mints or checks a share token.
auth = ["dep:sha2", "dep:getrandom"]
# The multi-user API server.
server = ["auth", "dep:axum", "dep:tokio", "dep:tokio-postgres", "dep:deadpool-postgres", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber", "dep:futures-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned: the egui painting and widget APIs used here are version sensitive.
egui = { version = "=0.31", optional = true }
eframe = { version = "=0.31", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    # default-features is off, so the winit backends must be named explicitly or
    # winit refuses to build with "the platform you're compiling for is not
    # supported". Harmless on macOS/Windows, required on Linux.
    "wayland",
    "x11",
] }
ehttp = { version = "0.5", optional = true }

# Sync driver, driven from a worker thread so the UI never blocks on I/O.
postgres = { version = "0.19", optional = true }

# Face -> server. Blocking, because the store worker is already a thread.
ureq = { version = "2", optional = true, default-features = false, features = ["json", "tls"] }

# Capability links: SHA-256 for storing token digests, getrandom for minting.
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }

# Server side.
axum = { version = "0.8", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
tower-http = { version = "0.6", optional = true, features = ["trace", "cors"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
futures-util = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[profile.release]
opt-level = 2

[dev-dependencies]
# The concurrency tests need a runtime of their own.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
# The auth tests drive the API over real HTTP rather than calling handlers
# directly, so routing, extractors and status codes are covered too. rustls
# rather than native-tls to keep the test build free of OpenSSL headers.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
